<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стенд браузерного агента</title>
  <style>
    body { font: 16px sans-serif; margin: 2rem; }
    section { margin: 1rem 0; padding: 1rem; border: 1px solid #bbb; }
    iframe { width: 100%; min-height: 220px; border: 1px solid #777; }
  </style>
</head>
<body>
  <h1>Стенд браузерного агента</h1>
  <div id="loading">Загрузка…</div>

  <section>
    <label for="agent-name">Имя агента</label>
    <input id="agent-name" data-testid="agent-name" placeholder="Введите имя">
    <button id="save" type="button">Сохранить</button>
    <output id="status" aria-live="polite">Ожидание</output>
  </section>

  <section>
    <button class="duplicate" type="button">Одинаковая кнопка</button>
    <button class="duplicate" type="button">Одинаковая кнопка</button>
    <button id="rerender" type="button">Заменить поле в DOM</button>
  </section>

  <section>
    <div id="shadow-host"></div>
  </section>

  <section>
    <iframe id="test-frame" name="test-frame" src="agent-browser-frame.html"></iframe>
  </section>

  <script>
    const bindSave = () => {
      document.querySelector("#save").onclick = () => {
        const value = document.querySelector("#agent-name").value;
        document.querySelector("#status").textContent = `Готово: ${value}`;
      };
    };
    bindSave();

    document.querySelector("#rerender").onclick = () => {
      const current = document.querySelector("#agent-name");
      const replacement = current.cloneNode(true);
      current.replaceWith(replacement);
      bindSave();
    };

    const shadow = document.querySelector("#shadow-host").attachShadow({ mode: "open" });
    shadow.innerHTML = `
      <button type="button" aria-label="Кнопка в Shadow DOM">Теневая кнопка</button>
      <output aria-live="polite">Тень ожидает</output>
    `;
    shadow.querySelector("button").onclick = () => {
      shadow.querySelector("output").textContent = "Готово: Shadow DOM";
    };

    setTimeout(() => document.querySelector("#loading").remove(), 400);
  </script>
</body>
</html>
