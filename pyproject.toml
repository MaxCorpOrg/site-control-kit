[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-control-kit"
version = "0.1.0"
description = "Local website control hub with browser extension bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Site Control Kit Contributors" }]
keywords = ["automation", "browser", "extension", "playwright", "dom"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "python-dotenv==1.2.2",
  "PyYAML==6.0.2",
  "telethon==1.43.2",
  "opentele==1.15.1; platform_system != 'Windows'",
  "tgcrypto==1.2.5; platform_system != 'Windows'"
]

[project.scripts]
sitectl = "webcontrol.cli:main"
telegram-username-collector = "scripts.telegram_username_collector_launcher:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["webcontrol", "scripts", "scripts.*"]

[tool.setuptools.package-data]
scripts = ["*.sh", "*.js", "*.txt"]
