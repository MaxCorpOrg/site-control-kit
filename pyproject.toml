[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-control-kit"
version = "0.1.1"
description = "Local website control hub with browser extension bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Site Control Kit Contributors" }]
keywords = ["automation", "browser", "extension", "playwright", "dom"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = []

[project.scripts]
sitectl = "webcontrol.cli:main"
tool-platform = "tool_platform.cli:main"
telegram-control-center = "tool_platform.control_center:main"

[tool.setuptools.packages.find]
include = [
  "webcontrol*",
  "tool_platform*",
  "telegram_portable_session_tool*"
]
